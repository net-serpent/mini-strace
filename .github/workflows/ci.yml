name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # ptrace needs a real Linux kernel, so this can't run on macOS/Windows
    # runners the way the rest of this repo's tooling (Docker on macOS)
    # works around that — ubuntu-latest already is Linux, no container
    # needed here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make python3 libc6-dev

      - name: Build
        run: make

      - name: Run tests
        run: bash tests/run_tests.sh

      - name: Run property tests (ASan/UBSan)
        run: make property-test
